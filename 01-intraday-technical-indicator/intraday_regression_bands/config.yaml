project:
  name: "intraday_regression_bands"
  timezone: "UTC"

data:
  source: "binance_public_data"
  market: "futures_um"
  symbols: ["BTCUSDT", "ETHUSDT"]
  intervals: ["1m", "5m", "15m"]
  start_date: "2021-01-01"
  end_date: "2025-12-31"
  raw_dir: "data/raw/binance"
  processed_dir: "data/processed"

backtest:
  initial_capital: 10000
  allow_short: true
  execution: "next_open"
  fee_bps_per_side: [0, 2, 5, 10]
  slippage_bps_per_side: [0, 2, 5, 10]
  max_position: 1.0
  close_position_end_of_day: false
  max_holding_bars: null

features:
  rsi_windows: [14, 21]
  stochastic_windows: [14, 21]
  bollinger_windows: [20, 50, 100]
  bollinger_k: [1.5, 2.0, 2.5]
  regression_windows: [50, 100, 200]
  regression_k: [1.5, 2.0, 2.5]

walk_forward:
  train_days: 180
  validation_days: 60
  test_days: 60
  step_days: 60
  selection_metric: "net_sharpe"
